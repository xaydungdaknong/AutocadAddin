name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build AutocadAddin.sln -c Release

      - name: Test
        run: dotnet test tests/DwgToDxf.Tests -c Release --no-build

      # Gói cài đặt: giải nén, chạy install.cmd (đóng AutoCAD trước).
      - uses: actions/upload-artifact@v4
        with:
          name: DwgToDxf-AutoCAD2023
          path: dist/
          if-no-files-found: error
